<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CivitAI Model Pedigree — Time-Forced Cluster Map</title>
<style>
  :root{
    --bg:#05070c; --panel:#0d1220ee; --panel-border:#26314a; --text:#e7ecf7;
    --muted:#8b96b3; --accent:#5fa8ff; --mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
  }
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    overflow:hidden;}
  #stage{position:absolute;inset:0;}
  canvas{position:absolute;inset:0;display:block;}
  #gl{z-index:1;}
  #overlay{z-index:2;pointer-events:none;}

  .panel{background:var(--panel);border:1px solid var(--panel-border);
    border-radius:10px;backdrop-filter:blur(6px);box-shadow:0 8px 24px #0007;}

  #topbar{position:absolute;top:14px;left:14px;right:14px;z-index:10;
    display:flex;gap:10px;align-items:flex-start;pointer-events:none;}
  #topbar>*{pointer-events:auto;}

  #titleBlock{padding:10px 14px;min-width:260px;}
  #titleBlock h1{font-size:14px;margin:0 0 2px;font-weight:600;letter-spacing:.2px;}
  #testBadge{background:#ffb020;color:#1a1200;font-size:10px;font-weight:700;
    letter-spacing:.4px;padding:2px 6px;border-radius:4px;margin-left:6px;vertical-align:middle;}
  #titleBlock p{margin:0;font-size:11.5px;color:var(--muted);line-height:1.4;}
  #stats{font-size:11px;color:var(--muted);margin-top:6px;font-family:var(--mono);}
  #stats b{color:var(--text);}

  #searchWrap{flex:1;max-width:420px;padding:8px 10px;position:relative;}
  #searchInput{width:100%;box-sizing:border-box;background:#0006;border:1px solid var(--panel-border);
    border-radius:6px;color:var(--text);padding:8px 10px;font-size:13px;outline:none;}
  #searchInput:focus{border-color:var(--accent);}
  #searchResults{position:absolute;top:calc(100% + 6px);left:8px;right:8px;max-height:340px;
    overflow:auto;background:var(--panel);border:1px solid var(--panel-border);border-radius:8px;
    display:none;}
  #searchResults div.row{padding:7px 10px;font-size:12px;cursor:pointer;border-bottom:1px solid #26314a55;}
  #searchResults div.row:hover{background:#5fa8ff22;}
  #searchResults .nm{color:var(--text);}
  #searchResults .sub{color:var(--muted);font-size:10.5px;margin-top:1px;}
  #searchHint{font-size:10.5px;color:var(--muted);padding:6px 10px 0;}

  #controls{padding:8px 12px;display:flex;flex-direction:column;gap:6px;min-width:150px;}
  #controls button{background:#151b2c;border:1px solid var(--panel-border);color:var(--text);
    border-radius:6px;padding:6px 8px;font-size:11.5px;cursor:pointer;}
  #controls button:hover{border-color:var(--accent);}
  #controls label{font-size:10.5px;color:var(--muted);display:flex;align-items:center;gap:6px;}
  #controls input[type=range]{flex:1;}

  #legendPanel{position:absolute;top:78px;right:14px;bottom:14px;width:280px;z-index:9;
    display:flex;flex-direction:column;overflow:hidden;}
  #legendHead{padding:10px 12px 6px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;}
  #legendList{overflow:auto;padding:0 6px 8px;flex:1;}
  .legendRow{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:6px;cursor:pointer;font-size:11.5px;}
  .legendRow:hover{background:#5fa8ff1a;}
  .legendRow.dim{opacity:.35;}
  .swatch{width:10px;height:10px;border-radius:50%;flex:none;}
  .legendName{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .legendCount{color:var(--muted);font-family:var(--mono);font-size:10.5px;}

  #tooltip{position:absolute;z-index:20;max-width:280px;pointer-events:none;
    background:var(--panel);border:1px solid var(--panel-border);border-radius:10px;
    padding:10px;font-size:12px;display:none;}
  #tooltip img{width:100%;border-radius:6px;display:block;margin-bottom:8px;max-height:160px;object-fit:cover;background:#000;}
  #tooltip .ttName{font-weight:600;font-size:13px;margin-bottom:4px;color:var(--text);}
  #tooltip .ttRow{color:var(--muted);font-size:11px;display:flex;justify-content:space-between;gap:8px;margin:2px 0;}
  #tooltip .ttRow b{color:var(--text);font-weight:500;}
  #tooltip .ttTags{margin-top:6px;color:#9fb4e0;font-size:10.5px;line-height:1.5;}
  #tooltip a{color:var(--accent);text-decoration:none;}

  #loading{position:absolute;inset:0;z-index:100;background:var(--bg);display:flex;
    flex-direction:column;align-items:center;justify-content:center;gap:10px;transition:opacity .3s;}
  #loading .bar{width:280px;height:6px;background:#151b2c;border-radius:4px;overflow:hidden;}
  #loading .fill{height:100%;width:0;background:var(--accent);transition:width .25s;}
  #loading .msg{color:var(--muted);font-size:12px;font-family:var(--mono);}
  #loading h2{font-size:15px;font-weight:600;margin:0;}

  #footHint{position:absolute;bottom:14px;left:14px;z-index:10;font-size:10.5px;color:var(--muted);
    background:var(--panel);border:1px solid var(--panel-border);border-radius:8px;padding:6px 10px;}
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl"></canvas>
  <canvas id="overlay"></canvas>
</div>

<div id="topbar">
  <div class="panel" id="titleBlock">
    <h1>CivitAI Adapter Pedigree <span id="testBadge" hidden>TEST DATA</span></h1>
    <p>Every dot is one adapter (LoRA / checkpoint / …). Clusters are base models,<br>placed on a timeline by the median publish date of their own adapters.</p>
    <div id="stats">loading…</div>
  </div>
  <div class="panel" id="searchWrap">
    <input id="searchInput" placeholder="Search adapter name…" autocomplete="off">
    <div id="searchResults"></div>
  </div>
  <div class="panel" id="controls">
    <button id="fitBtn">Fit view</button>
    <button id="dataToggleBtn"></button>
    <label>size <input type="range" id="sizeSlider" min="0.5" max="40" step="0.5" value="10"></label>
    <label>glow <input type="range" id="alphaSlider" min="0.1" max="1" step="0.05" value="0.55"></label>
    <label><input type="checkbox" id="labelsToggle" checked style="width:auto"> base-model labels</label>
  </div>
</div>

<div class="panel" id="legendPanel">
  <div id="legendHead"><span>Base models</span><span id="legendCount"></span></div>
  <div id="legendList"></div>
</div>

<div id="tooltip"></div>
<div id="footHint">drag to pan · scroll to zoom · hover a dot for details</div>

<div id="loading">
  <h2>Loading adapter graph…</h2>
  <div class="bar"><div class="fill" id="loadFill"></div></div>
  <div class="msg" id="loadMsg">0 / 0 files</div>
</div>

<script>
(function(){
"use strict";

// ?test in the URL points at data_test/ (build_graph.py/compute_layout.py/
// respace.py's TEST_MODE output -- a small random sample, for fast
// iteration) instead of data/ (the full dataset). Kept as a URL flag
// rather than a hardcoded path so switching between them doesn't need an
// edit -- and so it's obvious which one is loaded (see the badge below).
const TEST_MODE = new URLSearchParams(location.search).has("test");
const DATA = TEST_MODE ? "data_test/" : "data/";
if(TEST_MODE) document.getElementById("testBadge").hidden = false;
// a clickable toggle, not just the ?test URL flag -- an IDE's built-in HTML
// preview panel usually has no editable address bar, so typing the flag
// in isn't an option there. This just navigates to the same page with (or
// without) ?test, which works the same way in any preview that got this
// page to load in the first place.
{
  const btn = document.getElementById("dataToggleBtn");
  btn.textContent = TEST_MODE ? "Use real data" : "Use test data (3k sample)";
  btn.onclick = () => { location.search = TEST_MODE ? "" : "test"; };
}

// CSS px reserved for the legend panel (right side, see #legendPanel) and
// the topbar (title/search/controls row, top side, see #topbar). Shared by
// the label layout (keeps labels clear of both) and fitView (so the graph
// is centered in the space actually visible around them, not the full
// canvas -- otherwise fitting to the full canvas both oversizes the
// content, since half of it ends up hidden *behind* the UI chrome, and
// leaves a matching gap on the opposite side, since the content's true
// center then sits off from the *visible* center instead of centered in
// it -- this is what used to let a cluster landing at the very top of the
// layout (nothing pins any particular cluster there, it's wherever the
// macro layout settles) end up effectively invisible, hidden under the
// topbar, even though fitView's math technically included it in frame.
const LEGEND_RESERVE_CSS = 330;
const TOPBAR_RESERVE_CSS = 182;    // measured (getBoundingClientRect): the controls
                                     // panel's real bottom edge is 167px, not ~112-124
                                     // as originally guessed (it grew a row when the
                                     // test-data toggle button was added)
const FILES = [
  ["positions","positions.bin","f32"],
  ["colors","colors.bin","u8"],
  ["sizes","sizes.bin","u8"],
  ["ids","ids.bin","u32"],
  ["days","days.bin","u16"],
  ["downloads","downloads.bin","u32"],
  ["baseModelIdx","baseModelIdx.bin","u8"],
  ["typeIdx","typeIdx.bin","u8"],
  ["nameOffsets","nameOffsets.bin","u32"],
  ["nameBlob","nameBlob.bin","bytes"],
  ["tagOffsets","tagOffsets.bin","u32"],
  ["tagBlob","tagBlob.bin","bytes"],
  ["imageOffsets","imageOffsets.bin","u32"],
  ["imageBlob","imageBlob.bin","bytes"],
];

const loadFill = document.getElementById("loadFill");
const loadMsg = document.getElementById("loadMsg");
const loadingEl = document.getElementById("loading");

function typedFromBuffer(kind, buf){
  switch(kind){
    case "f32": return new Float32Array(buf);
    case "u32": return new Uint32Array(buf);
    case "u16": return new Uint16Array(buf);
    case "u8": return new Uint8Array(buf);
    case "bytes": return new Uint8Array(buf);
  }
}

async function loadAll(){
  const metaResp = await fetch(DATA + "meta.json");
  const meta = await metaResp.json();
  const out = {};
  let done = 0;
  await Promise.all(FILES.map(async ([key, fname, kind]) => {
    const resp = await fetch(DATA + fname);
    const buf = await resp.arrayBuffer();
    out[key] = typedFromBuffer(kind, buf);
    done++;
    loadFill.style.width = Math.round(100 * done / FILES.length) + "%";
    loadMsg.textContent = `${done} / ${FILES.length} files (${fname})`;
  }));
  return { meta, ...out };
}

// ---------------------------------------------------------------------------
// Spatial grid (dense counting-sort bucket grid) for O(1)-ish hover picking
// ---------------------------------------------------------------------------
function buildGrid(positions, n, desiredCellSize, maxCells){
  let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
  for(let i=0;i<n;i++){
    const x=positions[2*i], y=positions[2*i+1];
    if(x<minX)minX=x; if(x>maxX)maxX=x;
    if(y<minY)minY=y; if(y>maxY)maxY=y;
  }
  const spanX = Math.max(1, maxX-minX), spanY = Math.max(1, maxY-minY);
  // Grow the cell size past `desiredCellSize` if needed to keep the total
  // bucket count under `maxCells` -- the layout's world-unit scale is
  // whatever the Python pipeline settled on (can change with tuning, e.g.
  // a big cluster's true packed footprint pushing the whole canvas wider),
  // and a fixed fine cell size over a huge bounding box would otherwise
  // try to allocate a multi-*billion*-entry Int32Array and crash outright
  // (RangeError/OOM) instead of just picking less precisely.
  let cellSize = desiredCellSize;
  const naiveCells = (spanX / cellSize + 2) * (spanY / cellSize + 2);
  if(naiveCells > maxCells){
    cellSize = Math.sqrt((spanX + 2*desiredCellSize) * (spanY + 2*desiredCellSize) / maxCells);
  }
  const gw = Math.max(1, Math.ceil(spanX/cellSize)+1);
  const gh = Math.max(1, Math.ceil(spanY/cellSize)+1);
  const cellOf = new Int32Array(n);
  const counts = new Int32Array(gw*gh+1);
  for(let i=0;i<n;i++){
    const gx = Math.floor((positions[2*i]-minX)/cellSize);
    const gy = Math.floor((positions[2*i+1]-minY)/cellSize);
    const c = gy*gw+gx;
    cellOf[i]=c;
    counts[c+1]++;
  }
  for(let c=0;c<gw*gh;c++) counts[c+1]+=counts[c];
  const cellStart = counts; // length gw*gh+1, CSR-style start offsets
  const order = new Int32Array(n);
  const cursor = cellStart.slice(0, gw*gh);
  for(let i=0;i<n;i++){
    const c = cellOf[i];
    order[cursor[c]++] = i;
  }
  return {minX,minY,gw,gh,cellSize,cellStart,order};
}
function gridQuery(grid, wx, wy, radiusCells, fn){
  const gx = Math.floor((wx-grid.minX)/grid.cellSize);
  const gy = Math.floor((wy-grid.minY)/grid.cellSize);
  for(let dy=-radiusCells; dy<=radiusCells; dy++){
    const yy = gy+dy;
    if(yy<0||yy>=grid.gh) continue;
    for(let dx=-radiusCells; dx<=radiusCells; dx++){
      const xx = gx+dx;
      if(xx<0||xx>=grid.gw) continue;
      const c = yy*grid.gw+xx;
      const s = grid.cellStart[c], e = grid.cellStart[c+1];
      for(let k=s;k<e;k++) fn(grid.order[k]);
    }
  }
}

// ---------------------------------------------------------------------------
// WebGL setup
// ---------------------------------------------------------------------------
const glCanvas = document.getElementById("gl");
const gl = glCanvas.getContext("webgl", {antialias:true, alpha:false, premultipliedAlpha:false});
if(!gl){
  loadingEl.innerHTML = "<h2>WebGL is not available</h2><div class='msg'>" +
    "This visualization needs WebGL. Try a different browser, enable hardware " +
    "acceleration, or update your graphics drivers.</div>";
  throw new Error("WebGL unavailable");
}

function compileShader(src, type){
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)){
    console.error(gl.getShaderInfoLog(s));
    throw new Error("shader compile failed");
  }
  return s;
}

const VERT = `
  attribute vec2 aPosition;
  attribute vec3 aColor;
  attribute float aSize;
  uniform vec2 uCenter;
  uniform float uScale;
  uniform vec2 uResolution;
  uniform float uSizeMul;
  varying vec3 vColor;
  void main(){
    vec2 rel = (aPosition - uCenter) * uScale;
    vec2 clip = rel / (uResolution * 0.5);
    gl_Position = vec4(clip, 0.0, 1.0);
    // Bigger overall, and a wider spread between least- and most-downloaded
    // (was 1.6-7.6, a ~4.75x range; now 2.2-13.2, a 6x range) so popular
    // adapters actually read as bigger dots instead of a subtle gradient.
    // Keep DOT_R0/DOT_R1 below (respace.py) equal to half of these two
    // constants -- that's what the declutter pass spaces adapters apart by,
    // so if this range changes, points can start overlapping again at the
    // default size until respace.py is re-run with matching constants.
    float worldDiam = (2.2 + (aSize/255.0)*11.0) * uSizeMul;
    // ceiling raised well past the old 58px cap so the wider size-slider
    // range (up to 40x) actually keeps growing the dots instead of maxing
    // out early -- note some GPUs/drivers silently cap gl_PointSize below
    // this regardless (WebGL's ALIASED_POINT_SIZE_RANGE), nothing to fix
    // on our end for that, it's a hardware ceiling.
    gl_PointSize = clamp(worldDiam * uScale, 1.6, 220.0);
    vColor = aColor;
  }
`;
const FRAG = `
  precision mediump float;
  varying vec3 vColor;
  uniform float uAlpha;
  void main(){
    vec2 d = gl_PointCoord - vec2(0.5);
    float dist = length(d)*2.0;
    if(dist > 1.0) discard;
    float a = (1.0 - dist) * uAlpha;
    gl_FragColor = vec4(vColor * a, a);
  }
`;

const prog = gl.createProgram();
gl.attachShader(prog, compileShader(VERT, gl.VERTEX_SHADER));
gl.attachShader(prog, compileShader(FRAG, gl.FRAGMENT_SHADER));
gl.linkProgram(prog);
if(!gl.getProgramParameter(prog, gl.LINK_STATUS)){
  console.error(gl.getProgramInfoLog(prog));
}
gl.useProgram(prog);

const locPosition = gl.getAttribLocation(prog, "aPosition");
const locColor = gl.getAttribLocation(prog, "aColor");
const locSize = gl.getAttribLocation(prog, "aSize");
const uCenter = gl.getUniformLocation(prog, "uCenter");
const uScale = gl.getUniformLocation(prog, "uScale");
const uResolution = gl.getUniformLocation(prog, "uResolution");
const uAlpha = gl.getUniformLocation(prog, "uAlpha");
const uSizeMul = gl.getUniformLocation(prog, "uSizeMul");

gl.enable(gl.BLEND);
gl.blendFunc(gl.SRC_ALPHA, gl.ONE); // additive: dense clusters glow brighter
gl.clearColor(0.02,0.027,0.047,1);

// ---------------------------------------------------------------------------
// Camera
// ---------------------------------------------------------------------------
const camera = {x:0, y:0, scale:0.1};
let dirty = true;
function markDirty(){ dirty = true; }

function resize(){
  const dpr = Math.min(2, window.devicePixelRatio||1);
  for(const c of [glCanvas, overlayCanvas]){
    c.width = Math.round(innerWidth*dpr);
    c.height = Math.round(innerHeight*dpr);
    c.style.width = innerWidth+"px";
    c.style.height = innerHeight+"px";
  }
  gl.viewport(0,0,glCanvas.width, glCanvas.height);
  markDirty();
}
window.addEventListener("resize", resize);

function screenToWorld(px, py){
  const rx = (px/glCanvas.width*2-1) * (glCanvas.width*0.5);
  const ry = -(py/glCanvas.height*2-1) * (glCanvas.height*0.5);
  return [camera.x + rx/camera.scale, camera.y + ry/camera.scale];
}

// ---------------------------------------------------------------------------
// Overlay (labels + hover ring), plain 2D canvas on top of the GL canvas
// ---------------------------------------------------------------------------
const overlayCanvas = document.getElementById("overlay");
const octx = overlayCanvas.getContext("2d");

function worldToScreen(wx, wy){
  const rx = (wx - camera.x) * camera.scale;
  const ry = (wy - camera.y) * camera.scale;
  return [glCanvas.width/2 + rx, glCanvas.height/2 - ry];
}

let hoverIndex = -1;
let selectedIndex = -1;
// Set when a legend row is clicked (see below): flies to that cluster and,
// while it stays set, hides every *other* cluster's label from the scene
// (they're still in the legend list) so a focused view doesn't read as
// cluttered with unrelated names. Cleared by "Fit view" / Escape / focusing
// a different cluster.
let focusedGi = -1;

// Base-model labels used to render dead-center in each blob, but with ~90
// clusters some inevitably ended up close together on screen and the text
// overlapped -- the earlier fix shelf-packed every label into a few dense
// rows pinned to the very top/bottom of the screen, with a leader line
// running most of the way across the viewport back to its cluster. That
// made labels read as a separate legend floating far from the thing they
// name. Instead: try to place each label right next to its own centroid,
// just outside the cluster's screen radius, and only push it further out
// -- in whichever of 8 compass directions and step distances clears the
// collision -- when a neighboring cluster's label is already sitting
// there. Bigger clusters (more likely to matter, and to already dominate
// their neighborhood visually) get first pick of position; everything
// else fills in around them. Every label still gets a thin leader line
// back to its actual centroid (bm.labelCx/labelCy -- the cluster's real
// mean adapter position, not the FA2 hub pin, which can sit off-center
// once neighbor repulsion bulges a cluster to one side; see
// compute_layout.py/respace.py), but it's usually just a short stub now.
// The legend panel and top nav bar are still treated as no-go space.
const LABEL_PX_CSS = 10;          // fixed size regardless of cluster size/zoom -- see below
const LABEL_GAP_CSS = 6;          // gap between a cluster's screen edge and its label
const LABEL_MIN_OFFSET_CSS = 12;  // never hug closer than this, even for a tiny/far cluster
const LABEL_STEP_MULTS = [1, 1.8, 2.8, 4.2, 6]; // how far out the search tries, in gap-steps
const LABEL_DIRS = [               // directions to try at each step: N/S/E/W before diagonals
  [0, -1], [0, 1], [1, 0], [-1, 0],
  [0.7071, -0.7071], [-0.7071, -0.7071], [0.7071, 0.7071], [-0.7071, 0.7071],
];

function drawLabelsWithLeaderLines(state, dpr){
  const W = overlayCanvas.width, H = overlayCanvas.height;
  const minScreenRadius = 5 * dpr;    // skip clusters too small to matter on screen
  const legendReserve = LEGEND_RESERVE_CSS * dpr;
  const topbarReserve = TOPBAR_RESERVE_CSS * dpr;
  const margin = 10 * dpr;
  const maxX = W - legendReserve;
  const px = LABEL_PX_CSS * dpr;
  octx.font = `600 ${px}px -apple-system,Segoe UI,Roboto,sans-serif`;

  const items = [];
  state.meta.baseModels.forEach((bm, gi) => {
    if(focusedGi >= 0 && gi !== focusedGi) return; // focused view: only that cluster's name
    const isFocused = gi === focusedGi;
    const lx = bm.labelCx ?? bm.cx, ly = bm.labelCy ?? bm.cy;
    const [sx, sy] = worldToScreen(lx, ly);
    const screenR = bm.radius * camera.scale;
    // The focused cluster's own label is exempt from every visibility cull
    // below -- it's the one thing the user explicitly asked to see, so it
    // must render even if its anchor lands slightly outside these margins
    // (e.g. mid fly-to-animation, or a tiny/off-center cluster) rather than
    // silently vanishing.
    if(!isFocused){
      if(screenR < minScreenRadius) return;
      if(sx < -200 * dpr || sx > maxX + 200 * dpr) return;
      if(sy < -200 * dpr || sy > H + 200 * dpr) return;
    }
    items.push({bm, sx, sy, screenR, textW: octx.measureText(bm.name).width});
  });
  if(items.length === 0) return;
  items.sort((a, b) => b.bm.count - a.bm.count); // bigger clusters place first

  const halfH = px * 0.75;
  const placed = []; // bounding boxes of labels already placed this frame
  function overlapsPlaced(cx, cy, hw, hh){
    const l = cx-hw, r = cx+hw, t = cy-hh, b = cy+hh;
    for(const p of placed){
      if(l < p.right && r > p.left && t < p.bottom && b > p.top) return true;
    }
    return false;
  }
  for(const it of items){
    const hw = it.textW / 2 + 2 * dpr;
    const r0 = Math.max(it.screenR + LABEL_GAP_CSS * dpr, LABEL_MIN_OFFSET_CSS * dpr);
    let best = null;
    search:
    for(const mult of LABEL_STEP_MULTS){
      for(const [dx, dy] of LABEL_DIRS){
        let cx = it.sx + dx * r0 * mult;
        let cy = it.sy + dy * r0 * mult;
        cx = Math.min(maxX - margin - hw, Math.max(margin + hw, cx));
        cy = Math.min(H - margin - halfH, Math.max(topbarReserve + margin + halfH, cy));
        if(!best) best = {cx, cy, dx, dy}; // fallback if every candidate collides
        if(!overlapsPlaced(cx, cy, hw, halfH)){ best = {cx, cy, dx, dy}; break search; }
      }
    }
    it.labelX = best.cx; it.labelY = best.cy;
    placed.push({left: best.cx-hw, right: best.cx+hw, top: best.cy-halfH, bottom: best.cy+halfH});
    // leader line starts at the label's edge facing its centroid, not its
    // center, so a label sitting right next to its dots reads as a short
    // stub rather than a line drawn straight through the text
    it.lineFromX = best.cx - best.dx * hw;
    it.lineFromY = best.cy - best.dy * halfH;
  }

  octx.lineWidth = Math.max(1, dpr);
  for(const it of items){
    octx.beginPath();
    octx.moveTo(it.lineFromX, it.lineFromY);
    octx.lineTo(it.sx, it.sy);
    octx.strokeStyle = it.bm.colorHex + "66";
    octx.stroke();
  }
  octx.textAlign = "center";
  octx.textBaseline = "middle";
  for(const it of items){
    octx.fillStyle = "#0009";
    octx.fillText(it.bm.name, it.labelX + dpr, it.labelY + dpr);
    octx.fillStyle = it.bm.colorHex;
    octx.fillText(it.bm.name, it.labelX, it.labelY);
  }
}

function drawOverlay(state){
  const dpr = Math.min(2, window.devicePixelRatio||1);
  octx.clearRect(0,0,overlayCanvas.width, overlayCanvas.height);
  if(document.getElementById("labelsToggle").checked){
    drawLabelsWithLeaderLines(state, dpr);
  }
  const drawRing = (idx, color) => {
    if(idx < 0) return;
    const [sx, sy] = worldToScreen(state.positions[2*idx], state.positions[2*idx+1]);
    octx.beginPath();
    octx.arc(sx, sy, 9*dpr, 0, Math.PI*2);
    octx.strokeStyle = color;
    octx.lineWidth = 2*dpr;
    octx.stroke();
  };
  drawRing(selectedIndex, "#ffffff");
  drawRing(hoverIndex, "#5fa8ff");
}

// ---------------------------------------------------------------------------
// Main
// ---------------------------------------------------------------------------
loadAll().then(state => {
  loadingEl.style.opacity = "0";
  setTimeout(()=>loadingEl.style.display="none", 300);

  const n = state.meta.totalNodes;
  document.getElementById("stats").innerHTML =
    `<b>${n.toLocaleString()}</b> adapters &middot; <b>${state.meta.baseModels.length}</b> base models`;

  // GPU buffers (uploaded once, static)
  const posBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
  gl.bufferData(gl.ARRAY_BUFFER, state.positions, gl.STATIC_DRAW);

  const colBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, colBuf);
  gl.bufferData(gl.ARRAY_BUFFER, state.colors, gl.STATIC_DRAW);

  const sizeBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, sizeBuf);
  gl.bufferData(gl.ARRAY_BUFFER, state.sizes, gl.STATIC_DRAW);

  function render(){
    gl.viewport(0,0,glCanvas.width, glCanvas.height);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.useProgram(prog);
    gl.uniform2f(uCenter, camera.x, camera.y);
    gl.uniform1f(uScale, camera.scale);
    gl.uniform2f(uResolution, glCanvas.width, glCanvas.height);
    gl.uniform1f(uAlpha, parseFloat(alphaSlider.value));
    gl.uniform1f(uSizeMul, parseFloat(sizeSlider.value));

    gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
    gl.enableVertexAttribArray(locPosition);
    gl.vertexAttribPointer(locPosition, 2, gl.FLOAT, false, 0, 0);

    gl.bindBuffer(gl.ARRAY_BUFFER, colBuf);
    gl.enableVertexAttribArray(locColor);
    gl.vertexAttribPointer(locColor, 3, gl.UNSIGNED_BYTE, true, 0, 0);

    gl.bindBuffer(gl.ARRAY_BUFFER, sizeBuf);
    gl.enableVertexAttribArray(locSize);
    gl.vertexAttribPointer(locSize, 1, gl.UNSIGNED_BYTE, false, 0, 0);

    gl.drawArrays(gl.POINTS, 0, n);
    drawOverlay(state);
  }

  function loop(){
    if(dirty){
      try{ render(); } catch(err){ console.error("render failed:", err); }
      dirty = false;
    }
    requestAnimationFrame(loop);
  }

  resize();

  // ---- fit view -----------------------------------------------------------
  function fitView(){
    focusedGi = -1; // back to overview: every cluster's name is fair game again
    let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
    for(const bm of state.meta.baseModels){
      minX=Math.min(minX, bm.cx-bm.radius); maxX=Math.max(maxX, bm.cx+bm.radius);
      minY=Math.min(minY, bm.cy-bm.radius); maxY=Math.max(maxY, bm.cy+bm.radius);
    }
    const pad = 60;
    const w = (maxX-minX)+pad*2, h=(maxY-minY)+pad*2;
    // Fit to the space actually visible around the legend panel and the
    // topbar, not the full canvas -- see TOPBAR_RESERVE_CSS/LEGEND_RESERVE_CSS's
    // comment for why fitting to the full canvas both oversizes the content
    // (part of it ends up hidden behind the UI chrome) and off-centers it.
    const dpr = Math.min(2, window.devicePixelRatio||1);
    const legendPx = LEGEND_RESERVE_CSS * dpr;
    const topbarPx = TOPBAR_RESERVE_CSS * dpr;
    const usableWidth = Math.max(1, glCanvas.width - legendPx);
    const usableHeight = Math.max(1, glCanvas.height - topbarPx);
    camera.scale = Math.min(usableWidth/w, usableHeight/h);
    camera.x = (minX+maxX)/2 + (legendPx/2)/camera.scale;
    camera.y = (minY+maxY)/2 + (topbarPx/2)/camera.scale;
    markDirty();
  }
  fitView();
  document.getElementById("fitBtn").onclick = fitView;
  sizeSlider.oninput = markDirty;
  alphaSlider.oninput = markDirty;
  labelsToggle.onchange = markDirty;

  // ---- pan / zoom -----------------------------------------------------------
  let dragging = false, lastX=0, lastY=0, draggedDist=0;
  glCanvas.style.cursor = "grab";
  glCanvas.addEventListener("mousedown", e=>{
    dragging = true; lastX=e.clientX; lastY=e.clientY; draggedDist=0;
    glCanvas.style.cursor = "grabbing";
  });
  window.addEventListener("mouseup", ()=>{ dragging=false; glCanvas.style.cursor="grab"; });
  window.addEventListener("blur", ()=>{ dragging=false; glCanvas.style.cursor="grab"; });
  window.addEventListener("mousemove", e=>{
    // self-heal: if the primary button isn't actually down (e.g. a stray
    // mouseup was missed while the cursor was outside the window), don't
    // get stuck panning forever with hover silently disabled
    if(dragging && (e.buttons & 1) === 0){
      dragging = false;
      glCanvas.style.cursor = "grab";
    }
    if(dragging){
      const dpr = Math.min(2, window.devicePixelRatio||1);
      const dx = (e.clientX-lastX)*dpr, dy=(e.clientY-lastY)*dpr;
      draggedDist += Math.abs(dx)+Math.abs(dy);
      camera.x -= dx/camera.scale;
      camera.y += dy/camera.scale;
      lastX=e.clientX; lastY=e.clientY;
      markDirty();
      hideTooltip();
    } else {
      schedulePick(e.clientX, e.clientY);
    }
  });
  glCanvas.addEventListener("wheel", e=>{
    e.preventDefault();
    const dpr = Math.min(2, window.devicePixelRatio||1);
    const px = e.clientX*dpr, py = e.clientY*dpr;
    const [wx, wy] = screenToWorld(px, py);
    const factor = Math.pow(1.0016, -e.deltaY);
    const newScale = Math.max(0.01, Math.min(400, camera.scale*factor));
    const rx = (px/glCanvas.width*2-1) * (glCanvas.width*0.5);
    const ry = -(py/glCanvas.height*2-1) * (glCanvas.height*0.5);
    camera.x = wx - rx/newScale;
    camera.y = wy - ry/newScale;
    camera.scale = newScale;
    markDirty();
  }, {passive:false});

  // ---- picking (throttled) --------------------------------------------------
  const CELL = 4;
  // 8M buckets is a hard ceiling regardless of how wide the layout ends up
  // (~32MB for the Int32Array count buffer) -- buildGrid grows the actual
  // cell size past CELL to stay under it instead of crashing; picking then
  // uses grid.cellSize (not CELL) so it stays correct either way.
  const MAX_GRID_CELLS = 8_000_000;
  const grid = buildGrid(state.positions, n, CELL, MAX_GRID_CELLS);
  const decoder = new TextDecoder("utf-8");
  function decodeAt(offsets, blob, i){
    return decoder.decode(blob.subarray(offsets[i], offsets[i+1]));
  }

  let pickTimer = null;
  function schedulePick(cx, cy){
    if(pickTimer) return;
    pickTimer = requestAnimationFrame(()=>{
      pickTimer = null;
      doPick(cx, cy);
    });
  }
  function doPick(clientX, clientY){
    const dpr = Math.min(2, window.devicePixelRatio||1);
    const px = clientX*dpr, py = clientY*dpr;
    const [wx, wy] = screenToWorld(px, py);
    const maxPickPx = 15*dpr;
    const maxPickWorld = maxPickPx/camera.scale;
    let best = -1, bestD2 = maxPickWorld*maxPickWorld;
    const radiusCells = Math.max(1, Math.ceil(maxPickWorld/grid.cellSize));
    gridQuery(grid, wx, wy, radiusCells, idx=>{
      const dx = state.positions[2*idx]-wx, dy = state.positions[2*idx+1]-wy;
      const d2 = dx*dx+dy*dy;
      if(d2 < bestD2){ bestD2 = d2; best = idx; }
    });
    if(best !== hoverIndex){
      hoverIndex = best;
      markDirty();
      if(best >= 0) showTooltip(best, clientX, clientY);
      else hideTooltip();
    } else if(best >= 0){
      moveTooltip(clientX, clientY);
    }
  }

  // ---- tooltip ---------------------------------------------------------------
  const tooltip = document.getElementById("tooltip");
  function showTooltip(idx, clientX, clientY){
    const name = decodeAt(state.nameOffsets, state.nameBlob, idx) || "(untitled)";
    const tags = decodeAt(state.tagOffsets, state.tagBlob, idx);
    const imgPath = decodeAt(state.imageOffsets, state.imageBlob, idx);
    const id = state.ids[idx];
    const bmIdx = state.baseModelIdx[idx];
    const bm = state.meta.baseModels[bmIdx];
    const typ = state.meta.types[state.typeIdx[idx]];
    const dl = state.downloads[idx];
    const d = new Date(Date.parse(state.meta.epoch));
    d.setUTCDate(d.getUTCDate() + state.days[idx]);
    const dateStr = d.toISOString().slice(0,10);

    let html = "";
    if(imgPath){
      html += `<img src="${state.meta.imagePrefix}${imgPath}" loading="lazy" onerror="this.remove()">`;
    }
    html += `<div class="ttName">${escapeHtml(name)}</div>`;
    html += row("base model", `<span style="color:${bm.colorHex}">&#9679;</span> ${escapeHtml(bm.name)}`);
    html += row("type", typ);
    html += row("published", dateStr);
    html += row("downloads", dl.toLocaleString());
    html += row("id", `<a href="https://civitai.com/models/${id}" target="_blank" rel="noopener">#${id} &#8599;</a>`);
    if(tags) html += `<div class="ttTags">${escapeHtml(tags)}</div>`;
    tooltip.innerHTML = html;
    tooltip.style.display = "block";
    moveTooltip(clientX, clientY);
  }
  function row(label, val){
    return `<div class="ttRow"><span>${label}</span><b>${val}</b></div>`;
  }
  function moveTooltip(clientX, clientY){
    const pad = 16;
    let left = clientX + pad, top = clientY + pad;
    const w = tooltip.offsetWidth || 260, h = tooltip.offsetHeight || 160;
    if(left + w > innerWidth - 10) left = clientX - w - pad;
    if(top + h > innerHeight - 10) top = innerHeight - h - 10;
    tooltip.style.left = left+"px";
    tooltip.style.top = top+"px";
  }
  function hideTooltip(){
    if(hoverIndex >= 0){ hoverIndex = -1; markDirty(); }
    tooltip.style.display = "none";
  }
  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  // ---- fly-to animation --------------------------------------------------
  function flyTo(wx, wy, targetScale){
    const sx0=camera.x, sy0=camera.y, ss0=camera.scale;
    const t0 = performance.now();
    const dur = 550;
    function step(){
      const t = Math.min(1, (performance.now()-t0)/dur);
      const e = 1-Math.pow(1-t,3);
      camera.x = sx0 + (wx-sx0)*e;
      camera.y = sy0 + (wy-sy0)*e;
      camera.scale = ss0 + (targetScale-ss0)*e;
      markDirty();
      if(t<1) requestAnimationFrame(step);
    }
    step();
  }

  // ---- legend --------------------------------------------------------------
  const legendList = document.getElementById("legendList");
  document.getElementById("legendCount").textContent = state.meta.baseModels.length;
  const sortedBm = state.meta.baseModels.map((b,i)=>({...b, idx:i})).sort((a,b)=>b.count-a.count);
  for(const bm of sortedBm){
    const row = document.createElement("div");
    row.className = "legendRow";
    row.innerHTML = `<span class="swatch" style="background:${bm.colorHex}"></span>
      <span class="legendName" title="${escapeHtml(bm.name)}">${escapeHtml(bm.name)}</span>
      <span class="legendCount">${bm.count.toLocaleString()}</span>`;
    row.title = `≈ ${bm.avgDate}`;
    row.onclick = ()=>{
      focusedGi = bm.idx; // hide every other cluster's label until fit/Escape/another focus
      markDirty();
      // Zoomed out further than a tight fit (radius*2.6 before) so a
      // focused cluster still shows its neighbors for context -- the point
      // of hiding other labels here is decluttering names, not the dots.
      const fitScale = Math.min(glCanvas.width, glCanvas.height) / (bm.radius*5.5);
      flyTo(bm.labelCx ?? bm.cx, bm.labelCy ?? bm.cy, Math.min(30, Math.max(0.3, fitScale)));
    };
    legendList.appendChild(row);
  }

  // ---- search (lazy full-name decode on first use) ---------------------------
  let allNames = null;
  function ensureNames(cb){
    if(allNames){ cb(); return; }
    searchHintSet("indexing names…");
    setTimeout(()=>{
      allNames = new Array(n);
      for(let i=0;i<n;i++) allNames[i] = decodeAt(state.nameOffsets, state.nameBlob, i);
      searchHintSet("");
      cb();
    }, 0);
  }
  function searchHintSet(msg){
    let hint = document.getElementById("searchHint");
    if(!msg){ if(hint) hint.remove(); return; }
    if(!hint){
      hint = document.createElement("div");
      hint.id = "searchHint";
      document.getElementById("searchResults").prepend(hint);
      document.getElementById("searchResults").style.display = "block";
    }
    hint.textContent = msg;
  }

  const searchInput = document.getElementById("searchInput");
  const searchResults = document.getElementById("searchResults");
  let searchTimer = null;
  searchInput.addEventListener("focus", ()=> ensureNames(()=>{}));
  searchInput.addEventListener("input", ()=>{
    clearTimeout(searchTimer);
    const q = searchInput.value.trim().toLowerCase();
    if(q.length < 2){ searchResults.style.display="none"; return; }
    searchTimer = setTimeout(()=> ensureNames(()=>runSearch(q)), 180);
  });
  function runSearch(q){
    const matches = [];
    for(let i=0;i<n;i++){
      if(allNames[i].toLowerCase().includes(q)){
        matches.push(i);
        if(matches.length > 4000) break; // cap scan cost for very short/common queries
      }
    }
    matches.sort((a,b)=> state.downloads[b]-state.downloads[a]);
    const top = matches.slice(0,20);
    searchResults.innerHTML = "";
    if(top.length===0){
      searchResults.innerHTML = `<div class="row"><span class="sub">no matches</span></div>`;
    }
    for(const idx of top){
      const bm = state.meta.baseModels[state.baseModelIdx[idx]];
      const d = document.createElement("div");
      d.className = "row";
      d.innerHTML = `<div class="nm">${escapeHtml(allNames[idx])}</div>
        <div class="sub">${escapeHtml(bm.name)} &middot; ${state.downloads[idx].toLocaleString()} downloads</div>`;
      d.onclick = ()=>{
        selectedIndex = idx;
        flyTo(state.positions[2*idx], state.positions[2*idx+1], 8);
        searchResults.style.display = "none";
      };
      searchResults.appendChild(d);
    }
    searchResults.style.display = "block";
  }
  document.addEventListener("click", e=>{
    if(!searchResults.contains(e.target) && e.target!==searchInput) searchResults.style.display="none";
  });
  document.addEventListener("keydown", e=>{
    if(e.key === "Escape"){ selectedIndex=-1; focusedGi=-1; searchResults.style.display="none"; searchInput.blur(); markDirty(); }
    if(e.key.toLowerCase() === "f" && document.activeElement!==searchInput) fitView();
  });

  loop();
}).catch(err => {
  console.error(err);
  loadMsg.textContent = "Failed to load: " + err.message;
});
})();
</script>
</body>
</html>
